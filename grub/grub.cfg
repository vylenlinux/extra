set default=0
set timeout=10

insmod all_video

if loadfont /boot/grub/fonts/unicode.pf2; then
    set gfxmode=800x600

    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
    insmod gfxterm
    insmod png

    terminal_output gfxterm
fi

set color_normal=cyan/blue
set color_highlight=white/blue

menuentry "Boot Vylen Linux (UEFI mode)" {
    linux /boot/vmlinuz ro quiet
    initrd /boot/initrd
}

menuentry "Boot Vylen Linux (UEFI mode) debug" {
    set background_color=black
    linux /boot/vmlinuz ro verbose
    initrd /boot/initrd
}
